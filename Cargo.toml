[package]
name = "anvilcad-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The anvil-brep adapter for the B-rep protocol the conformance suite drives"
publish = false

[dependencies]
brep-protocol = "2"
# AnvilCAD's exact kernel and its STEP writer, at release 0.1.2. Neither is on crates.io.
anvil-brep = { git = "https://github.com/swperb/anvilcad", rev = "44a2dd5d4a4ffbfb86b4009cb38b4732cb8ef389" }
anvil-step = { git = "https://github.com/swperb/anvilcad", rev = "44a2dd5d4a4ffbfb86b4009cb38b4732cb8ef389" }
glam = "0.34"
